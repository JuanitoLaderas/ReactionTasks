/* Signage design: flat black and light-grey panels, boxed monospace type, arrow cells and one
   orange-red accent. Every colour pair is checked by test/contrast.mjs (WCAG AA or better).
   Both themes define every token; "High contrast" (Settings) strengthens them again. */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #bdbdbd;
  --panel: #e6e6e6;          /* inverse surface: light panel with dark text */
  --panel-fg: #000000;
  --panel-muted: #3d3d3d;
  --field: #0d0d0d;
  --line: #ffffff;           /* borders of boxes and controls */
  --hair: #5c5c5c;           /* quiet dividers between table rows */
  --accent: #ff4a1c;         /* the orange-red block */
  --accent-fg: #000000;
  --accent-text: #ff6a3d;    /* accent used as text on the page background */
  --wrong: #ff6b5e;
  --on-wrong: #000000;
  --good: #4cd964;
  --focus: #ffd60a;
  --c1: #ff4a1c; --c2: #ffffff; --c3: #8f8f8f;   /* chart colours: also told apart by lightness and by label */
  --bw: 2px;
  --font: "RT Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ececec;
  --fg: #000000;
  --muted: #444444;
  --panel: #000000;
  --panel-fg: #ffffff;
  --panel-muted: #bdbdbd;
  --field: #ffffff;
  --line: #000000;
  --hair: #8a8a8a;
  --accent: #f2400f;
  --accent-fg: #000000;
  --accent-text: #b02608;
  --wrong: #c0001a;
  --on-wrong: #ffffff;
  --good: #0b6b27;
  --focus: #0a3cff;
  --c1: #d93c10; --c2: #000000; --c3: #6b6b6b;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }
/* High contrast: pure black or white, thicker borders, no grey text. */
:root[data-solid="1"] {
  --muted: #ffffff; --panel: #ffffff; --panel-muted: #000000; --hair: #ffffff; --field: #000000;
  --accent-text: #ff8a65; --wrong: #ff8a80; --good: #7dff9b; --bw: 3px;
}
:root[data-solid="1"][data-theme="light"] {
  --bg: #ffffff; --muted: #000000; --panel: #000000; --panel-muted: #ffffff; --hair: #000000; --field: #ffffff;
  --accent-text: #8a1f00; --wrong: #a30000; --good: #005c1f;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { font-size: 100%; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.55;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  font-variant-ligatures: none;
  padding-inline: 16px;
  padding-block: 16px 24px;
}
:root[data-text="large"] { font-size: 112.5%; }
:root[data-text="larger"] { font-size: 125%; }
body.running { overflow: hidden; }

.page { max-width: 72rem; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; flex-direction: column; gap: 0.75rem; }

/* ---------- top bar: a row of boxed labels ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between;
  background: var(--bg); border: var(--bw) solid var(--line);
}
.brand {
  display: inline-flex; align-items: center; gap: 0.7rem;
  font: inherit; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--panel-fg); background: var(--panel); border: 0; padding: 0.65rem 1rem; cursor: pointer; text-align: left;
}
.brand-mark { width: 0.85rem; height: 0.85rem; background: var(--accent); flex: none; }
.nav { display: flex; flex-wrap: wrap; align-items: stretch; }
.navbtn {
  font: inherit; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--fg); background: transparent; border: 0; border-left: var(--bw) solid var(--line);
  padding: 0.65rem 1.1rem; cursor: pointer;
}
.navbtn:hover { background: var(--panel); color: var(--panel-fg); }

const uniq = (list) => {
  const seen = new Set(), out = [];
  for (const w of list) {
    const x = String(w).trim(), k = x.toLowerCase();
    if (x && !seen.has(k)) { seen.add(k); out.push(x); }
  }
  return out;
};
const without = (list, ...ex) => {
  const bad = new Set(ex.flat().map((w) => w.toLowerCase()));
  return list.filter((w) => !bad.has(w.toLowerCase()));
};
const csvList = (s) => uniq(s.split(","));

// Turn spreadsheet rows (array of arrays) into a word bank, or explain what is wrong.
function parseBankRows(rows) {
  const norm = (s) => String(s == null ? "" : s).toLowerCase().replace(/[^a-z]/g, "");
  const ALIAS = {
    general: "general", animal: "animal", animals: "animal",
    notanimal: "notAnimal", nonanimal: "notAnimal", notanimals: "notAnimal",
    food: "fruit", foods: "fruit", fruit: "fruit", fruits: "fruit",
    occupation: "occupation", occupations: "occupation",
  };
  let bestMissing = COLS.map((c) => c[1]);
  for (let r = 0; r < Math.min(rows.length, 5); r++) {
    const cols = {};
    (rows[r] || []).forEach((c, i) => { const k = ALIAS[norm(c)]; if (k && !(k in cols)) cols[k] = i; });
    const missing = COLS.filter(([k]) => !(k in cols)).map((c) => c[1]);
    if (missing.length < bestMissing.length) bestMissing = missing;
    if (missing.length) continue;
    const words = {};
    for (const [k] of COLS) {
      words[k] = uniq(rows.slice(r + 1).map((row) => (row ? row[cols[k]] : "")).filter((v) => v !== "" && v != null));
    }
    const thin = COLS.filter(([k]) => words[k].length < CFG.minBankWords).map((c) => `${c[1]} (${words[c[0]].length})`);
    if (thin.length) return { ok: false, error: `Each column needs at least ${CFG.minBankWords} words. Too few in: ${thin.join(", ")}.` };
    return { ok: true, words };
  }
  return {
    ok: false,
    error: `Missing column(s): ${bestMissing.join(", ")}. The first row must hold the headers General, Animal, Not Animal, Food (or Fruit) and Occupation.`,
  };
}

function buildPools(n, bank) {
  const w = bank.words;
  if (n === 2) {
    return { animal: w.animal, other: without(uniq([...w.notAnimal, ...w.general]), w.animal) };
  }
  return { fruit: w.fruit, occupation: w.occupation, other: without(w.general, w.fruit, w.occupation) };
}

function taskCfg(n, bank, keys) {
  if (n === 2) {
    return {
      pools: buildPools(2, bank),
      weights: { animal: 0.7, other: 0.3 },        // share of animal ("go") words
      expected: { animal: keys.resp, other: null },
      hint: t("ANIMAL = {a}     anything else = do nothing", { a: keyCaps(keys.resp) }),
      pad: [{ label: t("Animal"), key: keys.resp }],
    };
  }
  return {
    pools: buildPools(3, bank),
    weights: { fruit: 1, occupation: 1, other: 1 },
    expected: { fruit: keys.fruit, occupation: keys.job, other: null },
    hint: t("FRUIT = {f}     OCCUPATION = {o}     anything else = do nothing", { f: keyCaps(keys.fruit), o: keyCaps(keys.job) }),
    pad: [{ label: t("Fruit"), key: keys.fruit }, { label: t("Occupation"), key: keys.job }],

}

const hash32 = (s) => {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
};
const hash64 = (s) => hash32(s) + hash32([...s].reverse().join("") + "#");

    theme: s.theme === "light" ? "light" : "dark",
    bankId: s.bankId || "builtin",
    repeatWords: s.repeatWords !== false,          // Levels 2 and 3: may a word come back?

    backupEvery: oneOf(s.backupEvery, [0, 5, 10, 25, 50], 10),   // remind the developer to back up after this many attempts not yet in a backup file (0 = never)

    touch: oneOf(s.touch, ["auto", "on", "off"], "auto"),
    feedback: oneOf(s.feedback, ["off", "sound", "vibrate", "both"], "off"),
    outlierLo: oneOf(s.outlierLo, [0, 100, 150, 200], 0),

// Measures how steadily this screen refreshes, since reaction times are only as exact as the frames.
function measureFrames(ms = 700) {
  return new Promise((resolve) => {
    const ts = [];

      if (done) return;

      const med = d[d.length >> 1], p95 = d[Math.min(d.length - 1, Math.floor(d.length * 0.95))];

      ts.push(performance.now());
      if (performance.now() - ts[0] >= ms || ts.length > 240) finish();

// Sends what is waiting, then reads everyone's attempts and participant notes into this device.

  try {
    await flushPending();
    const snap = await withTimeout(db.collection("attempts").limit(1000).get(), 20000);
    let added = 0;
    snap.docs.forEach((d) => { if (mergeAttempt(d.data())) added++; });
    const us = await withTimeout(db.collection("users").limit(1000).get(), 20000);
    let touched = 0;
    us.docs.forEach((d) => { if (mergeUserDoc(d.data())) touched++; });

    syncOk();

function nextInterval() {

const LEVEL_COLORS = { 1: "c1", 2: "c2", 3: "c3" };   // class names: the colours come from the theme
function lineChart(series, opts = {}) {
  const all = series.flatMap((s) => s.pts);
  if (!all.length) return null;
  const W = 320, H = 150, L = 42, R = 12, T = 10, B = 26;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 20) { lo -= 10; hi += 10; }
  const span = (hi - lo) * 0.1;
  lo = Math.max(0, lo - span); hi += span;
  const maxLen = Math.max(...series.map((s) => s.pts.length));
  const x = (i) => L + (maxLen <= 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (maxLen - 1));
  const y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const kids = [];
  for (let g = 0; g <= 3; g++) {
    const v = lo + ((hi - lo) * g) / 3, yy = y(v);
    kids.push(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, class: "grid" }), sv("text", { x: L - 6, y: yy + 3, "text-anchor": "end" }, String(Math.round(v))));
  }
  kids.push(sv("text", { x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle" }, opts.xLabel || t("Attempt")));
  for (const s of series) {
    if (!s.pts.length) continue;
    kids.push(sv("polyline", { points: s.pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "), class: s.color, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    s.pts.forEach((v, i) => kids.push(sv("circle", { cx: x(i).toFixed(1), cy: y(v).toFixed(1), r: 3.5, class: s.color })));
  }
  return sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": opts.label || "" }, kids);
}
// Bars: items [{ label, value, n }] drawn left to right.
function barChart(items, opts = {}) {
  const vals = items.map((i) => i.value).filter((v) => v != null);
  if (!vals.length) return null;
  const W = 320, H = 170, L = 42, R = 12, T = 12, B = 34;
  const hi = Math.max(...vals) * 1.15 || 1;
  const bw = (W - L - R) / items.length;
  const kids = [];
  for (let g = 0; g <= 3; g++) {
    const v = (hi * g) / 3, yy = T + (1 - g / 3) * (H - T - B);
    kids.push(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, class: "grid" }), sv("text", { x: L - 6, y: yy + 3, "text-anchor": "end" }, String(Math.round(v))));
  }
  items.forEach((it, i) => {
    const x0 = L + i * bw + bw * 0.2;
    if (it.value != null) {
      const bh = (it.value / hi) * (H - T - B);
      kids.push(sv("rect", { x: x0.toFixed(1), y: (H - B - bh).toFixed(1), width: (bw * 0.6).toFixed(1), height: bh.toFixed(1), rx: 0, class: it.color || "c1" }));
      kids.push(sv("text", { x: (x0 + bw * 0.3).toFixed(1), y: (H - B - bh - 4).toFixed(1), "text-anchor": "middle", class: "val" }, String(Math.round(it.value))));
    }
    kids.push(sv("text", { x: (x0 + bw * 0.3).toFixed(1), y: H - 18, "text-anchor": "middle" }, it.label));
    if (it.n != null) kids.push(sv("text", { x: (x0 + bw * 0.3).toFixed(1), y: H - 6, "text-anchor": "middle", class: "sub" }, `n=${it.n}`));
  });

function histogram(values, bin = 50, opts = {}) {
  if (!values.length) return null;
  const lo = Math.floor(Math.min(...values) / bin) * bin, hi = Math.ceil((Math.max(...values) + 1) / bin) * bin;
  const nb = Math.max(1, Math.round((hi - lo) / bin));
  const counts = new Array(nb).fill(0);
  values.forEach((v) => { counts[Math.min(nb - 1, Math.floor((v - lo) / bin))]++; });
  const W = 320, H = 170, L = 36, R = 12, T = 12, B = 30;
  const top = Math.max(...counts) * 1.1 || 1;
  const bw = (W - L - R) / nb;
  const kids = [];
  for (let g = 0; g <= 2; g++) {
    const yy = T + (1 - g / 2) * (H - T - B);
    kids.push(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, class: "grid" }), sv("text", { x: L - 6, y: yy + 3, "text-anchor": "end" }, String(Math.round((top * g) / 2))));
  }
  counts.forEach((c, i) => {
    const bh = (c / top) * (H - T - B);
    kids.push(sv("rect", { x: (L + i * bw + 0.5).toFixed(1), y: (H - B - bh).toFixed(1), width: Math.max(1, bw - 1).toFixed(1), height: bh.toFixed(1), rx: 0, class: opts.color || "c1" }));
  });
  const every = Math.max(1, Math.ceil(nb / 6));
  for (let i = 0; i <= nb; i += every) kids.push(sv("text", { x: (L + i * bw).toFixed(1), y: H - 14, "text-anchor": "middle" }, String(lo + i * bin)));

}

}

async function onBankFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const sheets = await readTableFile(await f.arrayBuffer());
    let result = null, lastErr = "";
    for (const [, rows] of sheets) {
      const r = parseBankRows(rows);
      if (r.ok) { result = r; break; }
      lastErr = r.error;
    }
    if (!result) { showSettings({ bad: true, text: lastErr }); return; }
    const bank = { id: "u" + Date.now(), name: f.name.replace(/\.[^.]+$/, ""), added: new Date().toISOString(), words: result.words };
    data.banks.push(bank);
    const ok = saveData();
    showSettings({ text: t("Added \"{name}\". Press Use to switch to it.", { name: bank.name }) + (ok ? "" : " " + t("It could not be saved in this browser.")) });
  } catch (e) {
    const m = e && e.message;
    showSettings({
      bad: true,
      text: m === "oldxls" ? t("Old .xls files are not supported. In Excel choose Save As and pick .xlsx or .csv.")
        : m === "nodecompress" ? t("This browser cannot open compressed Excel files. Save the sheet as .csv and upload that instead.")
        : t("That file could not be read. Use an .xlsx or .csv file."),
    });
  }
}

function introText(n) {
  const st = settings(), k = curKeys();
  const out = [];
  if (n === 1) {
    out.push(t("Press START. A word will then appear in the center of the screen at an unpredictable moment."));
    out.push(t("Press {key} as quickly as you can as soon as you see the word.", { key: keyPhrase(k.resp) }));
    out.push(runTrials() > 1
      ? t("You will do {n} trials in a row. If you press {key} before a word appears, that trial starts again.", { n: runTrials(), key: keyPhrase(k.resp) })
      : t("If you press {key} before a word appears, the task restarts.", { key: keyPhrase(k.resp) }));
  } else {
    const timer = t("A {dur} timer runs at the top of the screen while words appear one at a time.", { dur: durWord(runSeconds()) });
    const end = t("A wrong key turns the word red. Mistakes do not end the task. It stops when the timer reaches zero.");
    if (n === 2) {
      out.push(timer);
      out.push(t("ANIMAL word → press {key} as quickly as you can.", { key: keyPhrase(k.resp) }) + "\n" + t("Any other word → do nothing."));
    } else {
      out.push(timer);
      out.push(t("FRUIT → press {f} as quickly as you can.", { f: keyPhrase(k.fruit) }) + "\n" +
        t("OCCUPATION → press {o} as quickly as you can.", { o: keyPhrase(k.job) }) + "\n" + t("Anything else → do nothing."));
    }
    out.push(end);
  }
  if (runPractice()) out.push(t("A short practice comes first. It is not scored."));
  out.push(t("Press ESC at any time to pause."));
  return out.join("\n\n");
}

function makePad(list) {
  padEl.replaceChildren();
  if (!showTouch()) return;
  for (const b of list) {
    padEl.append(h("button", {
      type: "button", class: "padbtn",
      onpointerdown: (e) => { if (e.preventDefault) e.preventDefault(); if (S.keyHandler) S.keyHandler(b.key, e); },
    }, b.label));

// 3-2-1 before a task starts (Settings > Countdown).
function withCountdown(cb) {
  const id = S.runId;
  if (!settings().countdown) { cb(); return; }
  S.state = "countdown";
  S.keyHandler = escOnly;
  hintEl.textContent = t("Get ready…");
  const step = (n) => {
    if (id !== S.runId) return;
    if (n === 0) { wordEl.className = "word"; wordEl.textContent = ""; hintEl.textContent = ""; cb(); return; }
    wordEl.className = "word count";
    wordEl.textContent = String(n);
    later(CFG.countdownMs, () => step(n - 1));
  };
  step(3);
}

// ----------------------------------------------------------------- pausing
const PAUSABLE = new Set(["wait", "showing", "word", "fb", "blank", "feedback", "pfb"]);
function showPause(onResume) {
  S.paused = true;
  S.state = "paused";
  let card;
  const resume = () => {
    if (!S.paused) return;
    S.paused = false;
    S.pauses++;
    card.remove();
    onResume();
  };
  card = h("div", { class: "pausecard", role: "dialog", "aria-label": t("Paused") },
    h("h2", {}, t("Paused")),
    h("p", { class: "muted" }, t("Your progress on this task is kept. Resume when you are ready.")),
    h("div", { class: "row" }, btn(t("Resume"), resume, "primary"), btn(t("Quit to Home"), showHome)));
  stageEl.append(card);
  S.keyHandler = (k) => { if (k === "escape" || k === "enter") resume(); };
}
function pauseTask() {
  if (S.paused || !PAUSABLE.has(S.state)) return;
  cancelJobs();
  let onResume;
  if (S.n === 1) {
    onResume = () => { S.keyHandler = t1Key; t1Next(); };
  } else if (S.practiceRun) {
    S.cur = null;
    onResume = () => { S.keyHandler = practiceKey; practiceNext(); };
  } else {
    if (S.state === "feedback" && S.cur) { S.cur.correct = false; S.trials.push(S.cur); }   // answered (wrongly) before pausing
    S.cur = null;
    S.pausedAt = performance.now();
    onResume = resumeTimed;
  }
  wordEl.textContent = "";
  wordEl.className = "word";
  showPause(onResume);
}

// The fixation cross: a small + on screen while the next word is awaited (Settings > Fixation cross).
const crossOn = (n) => { const c = settings().cross; return c === "all" || (c === "l1" && n === 1); };
function showBlank() {
  const on = crossOn(S.n);
  wordEl.textContent = on ? "+" : "";
  wordEl.className = on ? "word dim" : "word";
}

// ---------------------------------------------------------- Level 1: Simple
function startTask1(opt = {}) {
  runFrame();
  S.n = 1;
  S.bank = runBank();
  S.keys = curKeys();
  S.rnd = Math.random;
  S.pauses = 0;
  S.practiceRun = false;
  S.t1 = { practice: opt.practice ? 1 : 0, count: runTrials(), trials: [], falseStarts: 0, word: "" };
  makePad([{ label: t("Tap"), key: S.keys.resp }]);
  withCountdown(t1Next);
}
function t1Next() {
  const q = S.t1;
  showBlank();
  const lead = q.practice ? t("Practice, not scored") + "  ·  " : q.count > 1 ? t("Trial {i} of {n}", { i: q.trials.length + 1, n: q.count }) + "  ·  " : "";
  hintEl.textContent = lead + t("Press {key} as soon as a word appears", { key: keyCaps(S.keys.resp) }) + "  ·  " + t("Esc: pause");
  S.state = "wait";
  S.keyHandler = t1Key;
  const fore = runFore();
  later(rand(fore[0], fore[1]), t1Show);
}
function t1Show() {
  const id = S.runId;
  S.t1.word = pick(S.bank.words.general);
  wordEl.textContent = S.t1.word.toUpperCase();
  wordEl.className = "word";
  S.state = "showing";
  requestAnimationFrame(() => {
    if (id !== S.runId || S.state !== "showing") return;
    S.t0 = performance.now();     // taken as the frame carrying the word is painted
    S.state = "word";
  });
}
function t1Key(k, e) {
  if (k === "escape") { pauseTask(); return; }
  if (k !== S.keys.resp) return;
  const q = S.t1;
  if (S.state === "wait") {
    cancelJobs();
    S.state = "false";
    q.falseStarts++;
    cue(false);
    wordEl.textContent = t("Too early!");
    wordEl.className = "word bad";
    S.keyHandler = escOnly;
    if (q.count === 1 && !settings().practice) {
      hintEl.textContent = t("Restarting the task…");
      later(CFG.falseStartMs, () => showIntro(1));
    } else {
      hintEl.textContent = t("Too early. This trial starts again…");
      later(CFG.falseStartMs, t1Next);
    }
  } else if (S.state === "word") {
    const rt = Math.max(0, stamp(e) - S.t0);
    cue(true);
    S.state = "fb";
    if (q.practice) {
      q.practice--;
      wordEl.className = "word ok";
      wordEl.textContent = `✓ ${Math.round(rt)} ms`;
      hintEl.textContent = t("Practice, not scored");
      later(CFG.feedbackMs + 400, t1Next);
      return;
    }
    q.trials.push({ word: q.word, category: "general", expected: S.keys.resp, response: k, rt_ms: r1(rt), correct: true });
    if (q.trials.length < q.count) {
      wordEl.className = "word ok";
      wordEl.textContent = `${Math.round(rt)} ms`;
      later(CFG.feedbackMs, t1Next);
    } else finishT1();
  }
}
function finishT1() {
  cancelJobs();
  S.state = "done";
  S.keyHandler = null;
  const q = S.t1, trials = q.trials, multi = q.count > 1;
  const sc = scoreTrials(trials, { noExclude: !multi });
  const all = trials.map((x) => x.rt_ms);
  const rt = sc.mean_rt_ms != null ? sc.mean_rt_ms : mean(all);   // if every trial was excluded, use them all
  const summary = {
    rt_ms: r1(rt), trials: q.count, median_rt_ms: sc.median_rt_ms != null ? sc.median_rt_ms : median(all),
    sd_rt_ms: sc.sd_rt_ms, false_starts: q.falseStarts, excluded_fast: sc.excluded_fast, excluded_slow: sc.excluded_slow,
  };
  record(1, summary, trials);
  const extra = [];
  if (multi) {
    extra.push([t("Median reaction time"), ms(summary.median_rt_ms)]);
    extra.push([t("Standard deviation"), ms(summary.sd_rt_ms)]);
    extra.push([t("Each trial"), trials.map((x) => `${Math.round(x.rt_ms)}${x.excluded ? "*" : ""}`).join(", ") + " ms"]);
    if (sc.excluded_fast + sc.excluded_slow) extra.push([t("Left out of the average (*)"), String(sc.excluded_fast + sc.excluded_slow)]);
  }
  if (q.falseStarts) extra.push([t("Early presses"), String(q.falseStarts)]);
  showResult(1, [[t("Your simple reaction time"), `${rt.toFixed(0)} ms`, multi ? t("Average of {n} trials", { n: q.count }) : ""]], extra);
}

// ------------------------------------------------- Levels 2 & 3: timed tasks
function startTimed(n, opt = {}) {
  runFrame();
  S.n = n;
  S.bank = runBank();
  S.seconds = runSeconds();
  S.repeat = runRepeat();
  S.keys = curKeys();
  S.queues = {};
  S.cfg = taskCfg(n, S.bank, S.keys);
  if (S.custom && S.custom.kind === "gonogo") S.cfg.weights = { animal: S.custom.goShare / 100, other: 1 - S.custom.goShare / 100 };
  S.trials = [];
  S.cur = null;
  S.last = null;
  S.lastIsi = null;
  S.pauses = 0;
  S.practiceRun = !!opt.practice;
  S.rnd = mkRng((opt.practice ? "P" : "L") + n);
  makePad(S.cfg.pad);
  withCountdown(() => (opt.practice ? beginPractice() : beginTimed()));
}
function beginTimed() {
  S.state = "blank";
  showBlank();
  S.keyHandler = timedKey;
  hintEl.textContent = S.cfg.hint + "  ·  " + t("Esc: pause");
  S.tStart = performance.now();
  timerEl.textContent = clock(S.seconds);
  later(S.seconds * 1000, finishTimed);   // strict end
  tick();
  scheduleNext();
}
function tick() {
  const remaining = Math.max(0, S.seconds - (performance.now() - S.tStart) / 1000);
  timerEl.textContent = clock(Math.ceil(remaining));
  if (remaining > 0) later(100, tick);
}
function scheduleNext() { later(nextInterval(), present); }
function resumeTimed() {
  const now = performance.now();
  S.tStart += now - S.pausedAt;           // paused time does not count against the timer
  S.keyHandler = timedKey;
  S.state = "blank";
  showBlank();
  later(S.seconds * 1000 - (now - S.tStart), finishTimed);
  tick();
  scheduleNext();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Next word of a category. With repetition off, every word in the category is shown once
// before any word comes back. Either way the same word never appears twice in a row.
function drawWord(cat) {
  const pool = S.cfg.pools[cat];
  if (S.repeat) return pick(pool.filter((x) => x !== S.last));
  let q = S.queues[cat];
  if (!q || !q.length) {
    q = shuffle(pool.slice());
    if (q.length > 1 && q[q.length - 1] === S.last) [q[0], q[q.length - 1]] = [q[q.length - 1], q[0]];
    S.queues[cat] = q;
  }
  return q.pop();
}
function newTrial() {
  const w = S.cfg.weights;
  const cats = Object.keys(w);
  let r = rnd() * cats.reduce((a, c) => a + w[c], 0);
  let cat = cats[cats.length - 1];
  for (const c of cats) { if ((r -= w[c]) < 0) { cat = c; break; } }
  const word = drawWord(cat);
  S.last = word;
  S.cur = { word, category: cat, expected: S.cfg.expected[cat], response: null, rt_ms: null, correct: null };
  wordEl.textContent = word.toUpperCase();
  wordEl.className = "word";
}
function present() {
  const id = S.runId;
  newTrial();
  S.state = "showing";
  requestAnimationFrame(() => {
    if (id !== S.runId || S.state !== "showing") return;
    S.t0 = performance.now();
    S.state = "word";
    S.trialJob = later(CFG.wordMs, endTrial);
  });
}
function timedKey(k, e) {
  if (k === "escape") { pauseTask(); return; }
  if (S.state !== "word" || !isResponseKey(k)) return;
  const cur = S.cur;
  cur.response = k;
  cur.rt_ms = r1(Math.max(0, stamp(e) - S.t0));
  cancelJob(S.trialJob);
  const right = k === cur.expected;
  cue(right);
  if (!right) {
    // Wrong input: show the word in red for a moment before moving on.
    S.state = "feedback";
    wordEl.className = "word bad";
    later(CFG.errorFlashMs, endTrial);
  } else {
    endTrial();
  }
}
function endTrial() {
  if (!S.cur) return;
  S.cur.correct = S.cur.response === S.cur.expected;
  S.trials.push(S.cur);
  S.cur = null;
  S.state = "blank";
  showBlank();
  scheduleNext();
}

// ---- practice (not scored, not saved)
function beginPractice() {
  S.pi = 0;
  S.keyHandler = practiceKey;
  timerEl.textContent = "";
  practiceNext();
}
function practiceNext() {
  if (S.pi >= CFG.practiceTrials) { showReady(S.n); return; }
  S.state = "blank";
  showBlank();
  hintEl.textContent = t("Practice {i} of {n}, not scored", { i: S.pi + 1, n: CFG.practiceTrials }) + "  ·  " + S.cfg.hint + "  ·  " + t("Esc: pause");
  later(rand(500, 1200), practicePresent);
}
function practicePresent() {
  const id = S.runId;
  newTrial();
  S.state = "showing";
  requestAnimationFrame(() => {
    if (id !== S.runId || S.state !== "showing") return;
    S.t0 = performance.now();
    S.state = "word";
    S.trialJob = later(CFG.wordMs, practiceEnd);
  });
}
function practiceKey(k, e) {
  if (k === "escape") { pauseTask(); return; }
  if (S.state !== "word" || !isResponseKey(k)) return;
  S.cur.response = k;
  S.cur.rt_ms = r1(Math.max(0, stamp(e) - S.t0));
  cancelJob(S.trialJob);
  practiceEnd();
}
function practiceEnd() {
  const cur = S.cur;
  if (!cur) return;
  const right = cur.response === cur.expected;
  cue(right);
  S.state = "pfb";
  S.cur = null;
  S.pi++;
  wordEl.className = "word " + (right ? "ok" : "bad");
  wordEl.textContent = right
    ? `✓ ${t("Correct")}${cur.rt_ms != null ? " · " + Math.round(cur.rt_ms) + " ms" : ""}`
    : `✗ ${cur.response == null ? t("Missed") : t("Wrong key")}`;
  later(CFG.feedbackMs + 500, practiceNext);
}
function showReady(n) {
  cancelJobs();
  reset();
  cardScreen(
    h("h1", {}, t("Practice complete")),
    h("p", { class: "muted" }, t("That practice was not scored. When you are ready, start the real task.")),
    btn(t("Start the task"), () => startTask(n, { practice: false, practiced: true }), "primary"),
    btn(t("Practice again"), () => startTask(n, { practice: true })),
    btn(t("Home"), showHome)
  );
  S.keyHandler = (k) => { if (k === "enter") startTask(n, { practice: false, practiced: true }); };
}

const CAT_LABEL = { animal: "Animal words", other: "Other words", fruit: "Fruit", occupation: "Occupations", general: "Words" };
function finishTimed() {
  cancelJobs();
  // A word that was answered (even wrongly) before time ran out still counts;
  // one still waiting for an answer is not scored.
  if (S.cur && S.cur.response != null) {
    S.cur.correct = S.cur.response === S.cur.expected;
    S.trials.push(S.cur);
  }
  S.cur = null;
  S.state = "done";
  S.keyHandler = null;
  const n = S.n;
  const sum = scoreTrials(S.trials);
  const mean_ = sum.mean_rt_ms;
  const stats = [
    [t("Average reaction time (correct responses)"), mean_ != null ? `${mean_.toFixed(0)} ms` : "n/a", ""],
    [t("Overall accuracy"), `${sum.accuracy_pct.toFixed(1)}%`, t("{c} of {n} words correct", { c: sum.correct, n: sum.total })],
  ];
  if (n === 3 && !S.custom) {
    const b = baselineFor(S.user, new Date().toISOString());
    const dec = mean_ != null && b ? mean_ - b.rt : null;
    sum.decision_time_ms = dec;
    sum.baseline_rt_ms = b ? b.rt : null;
    sum.baseline_attempt = b ? b.id : null;
    sum.baseline_trials = b ? b.trials : null;
    stats.push([
      t("Decision time (Level 3 RT − Level 1 RT)"),
      dec != null ? `${dec.toFixed(0)} ms` : "n/a",
      b ? t("Level 1 RT used: {ms} ms", { ms: b.rt.toFixed(0) }) + (b.trials > 1 ? t(" (mean of {n})", { n: b.trials }) : "") : "",
    ]);
  }
  record(n, sum, S.trials);
  const extra = [
    [t("Median reaction time"), ms(sum.median_rt_ms)],
    [t("Standard deviation"), ms(sum.sd_rt_ms)],
  ];
  if (n === 2) {
    extra.push([t("Animals caught"), `${sum.hits} of ${sum.go_trials}`]);
    extra.push([t("Pressed on a word to ignore"), `${sum.false_alarms} of ${sum.nogo_trials}`]);
  }
  extra.push([t("Missed targets"), String(sum.errors.omission)]);
  extra.push([t("Wrong key"), String(sum.errors.wrong_key)]);
  if (n === 3) extra.push([t("Pressed on a word to ignore"), String(sum.errors.commission)]);
  for (const [cat, b] of Object.entries(sum.by_category)) {
    extra.push([t(CAT_LABEL[cat] || cat), `${b.correct} of ${b.n}${b.mean_rt_ms != null ? " · " + Math.round(b.mean_rt_ms) + " ms" : ""}`]);
  }
  if (sum.excluded_fast + sum.excluded_slow) extra.push([t("Left out of the average"), String(sum.excluded_fast + sum.excluded_slow)]);
  if (S.pauses) extra.push([t("Pauses"), String(S.pauses)]);
  showResult(n, stats, extra);
}

// ----------------------------------------------------------------- results
const ms = (x) => (x == null ? "n/a" : `${x.toFixed(0)} ms`);
function record(n, summary, trials) {
  const ts = new Date().toISOString();
  summary = Object.assign({}, summary, { timestamp: ts });
  if (!S.custom) S.user.results[String(n)] = summary;
  const st = settings();
  const attempt = {
    id: newId(), task: n, timestamp: ts, summary, ...(S.custom ? { custom: { id: S.custom.id, name: S.custom.name, rev: S.custom.rev } } : {}), app_version: APP.version, device: { id: data.device.id, name: data.device.name }, stored: new Date().toISOString(),
    settings: {
      task_seconds: n === 1 ? null : S.seconds,
      repeat_words: n === 1 ? null : S.repeat,
      word_bank: S.bank ? S.bank.name : BUILTIN.name,
      word_bank_rev: bankRev(S.bank || BUILTIN),
      group: (activeGroup(S.user) || {}).name || null,
      keys: Object.assign({}, S.keys || curKeys()),
      practice: !!S.practiced,
      t1_trials: n === 1 ? S.t1.count : null,
      fore_ms: n === 1 && S.custom ? [S.custom.foreMin, S.custom.foreMax] : null,
      go_share: n === 2 && S.custom ? S.custom.goShare : null,
      countdown: st.countdown,
      cross: crossOn(n),
      outlier_lo: n === 1 && S.t1.count === 1 ? 0 : st.outlierLo,
      outlier_hi: n === 1 && S.t1.count === 1 ? 0 : st.outlierHi,
      seed: n !== 1 && st.seedOn ? st.seed : null,
    },
    env: S.env || null,
    pauses: S.pauses || 0,
    profile: Object.assign({}, S.user.profile),
  };
  if (trials) attempt.trials = trials;
  S.user.attempts.push(attempt);
  queueAttempt(attempt.id);
  S.saveOk = saveData();
  kick();
}

function showResult(n, stats, extra = []) {
  reset();
  const kids = [h("h1", {}, S.custom ? `${S.custom.name} — ${t("complete")}` : t("Level {n} complete", { n }))];
  for (const [label, value, sub] of stats) {
    kids.push(h("div", { class: "stat" },
      h("div", { class: "stat-label" }, label),
      h("div", { class: "stat-value" }, value),
      sub && h("div", { class: "stat-sub" }, sub)));
  }
  if (extra.length) {
    kids.push(h("details", { class: "attempt more" },
      h("summary", {}, t("More detail")),
      h("div", { class: "kv" }, extra.map(([l, v]) => h("div", { class: "kvrow" }, h("span", { class: "muted" }, l), h("span", {}, v))))));
  }
  if (!S.saveOk) kids.push(h("p", { class: "err" }, t("These results could not be saved in this browser.")));
  // Suggest what to do next: Level 1 leads to Level 2; Levels 2 and 3 can follow in either order.
  const custom = S.custom;
  const other = n === 2 ? 3 : n === 3 ? 2 : null;
  const next = custom ? null : n === 1 ? 2 : other && !S.user.results[String(other)] ? other : null;
  kids.push(h("div", { class: "row", style: "margin-top:1.25rem" },
    btn(custom ? t("Retry") : t("Retry level"), () => showIntro(n, custom)),
    next && btn(t("Level {n}", { n: next }), () => showIntro(next), "primary"),
    btn(t("Home"), showHome)));
  cardScreen(...kids);
}

// --------------------------------------------------------------- files
// Saves through the viewer's download prompt when the page offers it; a standalone copy of the
// page (opened as a file) uses an ordinary browser download.
async function saveFile(filename, payload, mime) {
  if (S.downloads) { await S.downloads.save({ filename, data: payload }); return "saved"; }
  const blob = new Blob([payload], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return "saved";
}

// --------------------------------------------------------------- developers
// Pull everyone's shared results in the background when the Developer page opens.
async function autoSync() {
  if (!settings().sync) return;
  const r = await syncNow();
  if (S.page === "dev" && !S.devOk && S.devKicked) { S.devKicked = false; showDevGate(); return; }
  if (S.page !== "dev" || !S.devOk || S.devView !== "list") return;
  if (r.ok && (r.added || r.touched)) { S.devNote = syncSummary(r); showDev(); return; }
  // Nothing new: only refresh the status line, so a message the developer is reading stays put.
  if (S.syncStateEl) S.syncStateEl.textContent = syncStateText() + (r.ok ? "" : " — " + syncSummary(r));
}
const syncStateText = () => (settings().sync
  ? `Shared storage: ${stateWord(SYNC.state)}${pendingCount() ? ` · ${waitText()}` : ""}${SYNC.last ? ` · last synced ${fmtWhen(SYNC.last)}` : " · not synced yet on this device"}`
  : "Shared storage: turned off in Settings");
function syncSummary(r) {
  if (!r) return "";
  if (r.ok) return `Shared storage synced${r.added ? `: ${r.added} new attempt${r.added === 1 ? "" : "s"} added` : ": nothing new"}${r.full ? " (showing the first 1000)" : ""}.`;
  return r.reason === "unavailable" ? "Shared storage isn't available in this view, so only data on this device is shown."
    : r.reason === "readonly" ? "Shared storage can be read but not written with this account, so new results stay on this device until synced."
    : "Couldn't reach shared storage. Showing data on this device; it will sync when a connection is available.";
}

const fmtWhen = (iso) => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString(); };
const outcome = (x) =>
  x.correct ? (x.expected == null ? "Correct (no press)" : "Correct") : x.response == null ? "Missed" : "Wrong key";

// Tables used by the spreadsheet export and the paste-ready copy buttons.
// They follow the filters and sorting chosen on the Developer page.
const num = (x) => (x == null || isNaN(x) ? "" : Math.round(x * 10) / 10);
const cell = (v) => (v == null ? "" : v);
const repLabel = (r) => (r == null ? "n/a" : r ? "Yes" : "No");
const yn = (v) => (v == null ? "" : v ? "Yes" : "No");

// The settings an attempt was run with. Level 1 has no time limit or repetition setting.
// Attempts saved before the repetition setting existed allowed repeats.
const settingsOf = (a) => {
  const st = a.settings || {}, l1 = a.task === 1;
  return {
    seconds: l1 || st.task_seconds == null ? null : st.task_seconds,
    repeat: l1 ? null : st.repeat_words == null ? true : st.repeat_words,
    bank: st.word_bank || "—",
  };
};
const keysText = (a) => { const k = (a.settings || {}).keys; return k ? (a.task === 3 ? `${keyLabel(k.fruit)} / ${keyLabel(k.job)}` : keyLabel(k.resp)) : ""; };
const allAttempts = () => Object.values(data.users).flatMap((u) => u.attempts);
// Attempts that reached this device after the last backup file was made (by running them here or importing them).
const unbackedCount = () => allAttempts().filter((a) => (a.stored || a.timestamp || "") > (data.last_backup || "")).length;
const deviceSlug = () => String(data.device.name).normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "device";
const FILTER_DEFAULT = () => ({ seconds: "all", repeat: "all", bank: "all", tag: "all", quality: "all", group: "all", tasks: "standard" });
const hasFilter = () => ["seconds", "repeat", "bank", "tag", "quality", "group"].some((k) => (S.devFilter[k] || "all") !== "all") || (S.devFilter.tasks || "standard") !== "standard";
const isExcluded = (u) => /excluded/i.test(u.tag || "");
function userPasses(u, f = S.devFilter) {
  const g = f.tag || "all";
  if (g === "all") return true;
  if (g === "!excluded") return !isExcluded(u);
  if (g === "none") return !u.tag;
  return u.tag === g;
}
// Level 1 is not affected by the time-limit and repetition filters, so it always passes those.
const passes = (a, f = S.devFilter) => {
  const st = settingsOf(a);
  const q = f.quality || "all";
  if (q === "!excluded" && isOut(a)) return false;
  if (q === "!flagged" && (isOut(a) || flagsOf(a).length)) return false;
  if (q === "flagged" && !flagsOf(a).length) return false;
  if (q === "excluded" && !isOut(a)) return false;
  const tk = f.tasks || "standard";   // custom tasks are kept out of the standard results unless asked for
  if (tk === "standard" ? !!a.custom : tk.startsWith("c:") ? !(a.custom && a.custom.id === tk.slice(2)) : false) return false;
  const g = f.group || "all", ag = (a.settings || {}).group || "";
  if (g === "none" ? ag !== "" : g !== "all" && ag !== g) return false;
  if (f.bank !== "all" && st.bank !== f.bank) return false;
  if (a.task !== 1) {
    if (f.seconds !== "all" && st.seconds !== Number(f.seconds)) return false;
    if (f.repeat !== "all" && String(st.repeat) !== f.repeat) return false;
  }

};
const filtered = (u) => (userPasses(u) ? u.attempts.filter((a) => passes(a)) : []);
const latestBy = (attempts) => {
  const m = {};

  return m;
};

const DEFAULT_DIR = { name: 1, done: -1, attempts: -1, l1: 1, l2rt: 1, l2acc: -1, l3rt: 1, l3acc: -1, dec: 1, last: -1, tag: 1 };
const SORT_VAL = {
  name: (r) => r.u.name.toLowerCase(), done: (r) => r.done, attempts: (r) => r.n, l1: (r) => r.l1,
  l2rt: (r) => r.l2rt, l2acc: (r) => r.l2acc, l3rt: (r) => r.l3rt, l3acc: (r) => r.l3acc,
  dec: (r) => r.dec, last: (r) => r.last, tag: (r) => (r.u.tag || "").toLowerCase(),
};
const empty = (v) => v == null || v === "";
// Blank values always sort to the bottom, whichever direction is chosen.
const byValue = (val, dir) => (x, y) => {
  const a = val(x), b = val(y);
  if (empty(a) && empty(b)) return 0;
  if (empty(a)) return 1;
  if (empty(b)) return -1;
  return (a < b ? -1 : a > b ? 1 : 0) * dir;
};

// One row per participant, built from the attempts that pass the current filters.
function participantRows() {
  const rows = [];
  for (const u of Object.values(data.users)) {
    if (!userPasses(u)) continue;
    const at = filtered(u);
    if (!at.length && hasFilter()) continue;
    const lat = latestBy(at);
    const s1 = lat[1] && lat[1].summary, s2 = lat[2] && lat[2].summary, s3 = lat[3] && lat[3].summary;
    rows.push({
      u, n: at.length, done: [1, 2, 3].filter((k) => lat[k]).length, s1, s2, s3,
      l1: s1 ? s1.rt_ms : null,
      l2rt: s2 ? s2.mean_rt_ms : null, l2acc: s2 ? s2.accuracy_pct : null,
      l3rt: s3 ? s3.mean_rt_ms : null, l3acc: s3 ? s3.accuracy_pct : null,
      dec: lat[3] ? (decisionFor(u, lat[3]) || {}).ms ?? null : null,
      last: at.reduce((m, a) => (a.timestamp > m ? a.timestamp : m), ""),
    });
  }
  const { key, dir } = S.devSort;
  return rows.sort(byValue(SORT_VAL[key], dir));
}

// Reads a backup file. Returns { ok, obj, entries } or { ok: false, error }.
function readBackup(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: "That file isn't valid JSON." }; }
  const users = obj && typeof obj === "object" ? (obj.users && typeof obj.users === "object" ? obj.users : obj) : null;
  const entries = users ? Object.entries(users).filter(([, u]) => u && typeof u === "object" && Array.isArray(u.attempts)) : [];
  if (!entries.length && !(obj && ((Array.isArray(obj.banks) && obj.banks.length) || (Array.isArray(obj.customTasks) && obj.customTasks.length)))) return { ok: false, error: "No participants were found in that file. Choose a backup made with Download backup." };
  return { ok: true, obj, entries };
}
// A participant in the file whose username already exists here may be the same person (their attempts are already
// here, or the password matches) or a different person who chose the same name on another device.
function sameLineage(local, src) {
  if (!local.attempts.length || !src.attempts.length) return true;
  const ids = new Set(local.attempts.map((x) => x.id).filter(Boolean));
  if (src.attempts.some((a) => a && (a.id && ids.has(a.id)))) return true;
  const la = local.auth, sa = src.auth;
  return !!(la && sa && la.hash && la.hash === sa.hash && la.salt === sa.salt);
}
// Where a participant from a file belongs here: their own username if that is free or the same person, or the
// "name (device)" copy made by an earlier import of the same device. null means a clash that needs a decision.
function targetKey(key, src) {
  const u = data.users[key];
  if (!u || sameLineage(u, src)) return key;
  const ids = new Set(src.attempts.map((a) => a && a.id).filter(Boolean));
  for (const [k, v] of Object.entries(data.users)) if (k.startsWith(key + " (") && v.attempts.some((x) => ids.has(x.id))) return k;
  return null;
}
// What importing would do, without changing anything: the participants whose name is already taken by someone who looks different.
function previewBackup(text) {
  const r = readBackup(text);
  if (!r.ok) return r;
  const from = r.obj.device && r.obj.device.name ? String(r.obj.device.name) : "";
  const clashes = [];
  for (const [key0, src] of r.entries) {
    const key = String(key0).toLowerCase();
    if (targetKey(key, src) === null) clashes.push({ key, name: src.name || key0, here: data.users[key].attempts.length, incoming: src.attempts.length });
  }
  return { ok: true, clashes, from, people: r.entries.length, attempts: r.entries.reduce((n, [, u]) => n + u.attempts.length, 0) };
}
// Merges a backup (or a "Copy all data" export) into this device. Existing attempts are never overwritten.
// decisions (optional): { username: "merge" | "separate" } for the clashes found by previewBackup. Without it every
// participant with a known username is merged, as in earlier versions.
function importBackup(text, decisions) {
  const r = readBackup(text);
  if (!r.ok) return r;
  const obj = r.obj, from = obj.device && obj.device.name ? String(obj.device.name).slice(0, 40) : "";
  let people = 0, added = 0, dupes = 0, banks = 0, merged = 0, separated = 0;
  for (const [key0, src] of r.entries) {
    let key = String(key0).toLowerCase();
    let name = src.name || key0;
    if (decisions) {
      const tk = targetKey(key, src);
      if (tk !== null) key = tk;
      else if ((decisions[key] || "separate") === "separate") {
        // keep the other person apart under a name that says where they came from
        const tag = from || "other device";
        let suffix = tag, i = 2;
        while (data.users[`${key} (${suffix})`.toLowerCase()]) suffix = `${tag} ${i++}`;
        key = `${key} (${suffix})`.toLowerCase(); name = `${name} (${suffix})`; separated++;
      } else merged++;
    }
    let u = data.users[key];
    if (!u) { u = data.users[key] = { name, results: {}, attempts: [], profile: { age: "", hand: "", device: "" }, tag: "", note: "", updated: "" }; people++; }
    let any = false;
    const sa = src.auth;
    if (sa && !u.auth && sa.hash && sa.salt && sa.iter) {
      u.auth = { alg: sa.alg || AUTH.alg, iter: sa.iter, salt: sa.salt, hash: sa.hash, created: sa.created || "", state: "pending" };
      queueClaim(key);
    }
    for (const a of src.attempts) {
      if (!a || !a.task || !a.summary || !a.timestamp) continue;
      const id = a.id || legacyId(key0, a);
      const dup = u.attempts.find((x) => x.id === id);
      if (dup) {
        dupes++;
        if (a.review && (!dup.review || (a.review.at || "") > (dup.review.at || ""))) { dup.review = a.review; queueAttempt(id); }
        continue;
      }
      const copy = Object.assign({}, a, { id, stored: new Date().toISOString() });
      if (!copy.device && obj.device && obj.device.id) copy.device = { id: String(obj.device.id), name: from };   // older attempts: say where they came from
      u.attempts.push(copy);
      queueAttempt(id);
      added++; any = true;
    }
    if ((src.updated || "") > (u.updated || "") || (!u.updated && (src.tag || src.note))) {
      u.profile = Object.assign({ age: "", hand: "", device: "" }, src.profile || {});
      u.tag = typeof src.tag === "string" ? src.tag : u.tag;
      u.note = typeof src.note === "string" ? src.note : u.note;
      u.updated = src.updated || u.updated;
      queueUser(key);
    }
    if (any) { rebuildResults(u); queueUser(key); }
  }
  for (const b of Array.isArray(obj.banks) ? obj.banks : []) {
    if (!validBank(b)) continue;
    const have = allBanks().find((x) => x.id === b.id);
    if (!have) { data.banks.push({ id: b.id, name: b.name, added: b.added || "", rev: bankRev(b), words: b.words }); banks++; }
    else if (JSON.stringify(have.words) !== JSON.stringify(b.words)) {   // same bank id, different words (edited on another device): keep both
      const c = { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: uniqueBankName(b.name, ` (${from || "other device"})`), added: b.added || "", rev: bankRev(b), words: b.words };
      data.banks.push(c); banks++;
    }
  }
  const tasks = importCustomTasks(obj.customTasks, from);
  // Developer accounts and study conditions come along only onto a device that has none of its own.
  if (!hasDevs() && obj.devs && typeof obj.devs === "object") { data.devs = obj.devs; normDevData(data); }
  if (!data.conditions.groups.length && obj.conditions) data.conditions = normConditions(obj.conditions);
  queueAllDevData();
  saveData();
  kick();
  return { ok: true, people, added, dupes, banks, tasks, merged, separated, from };
}

    `${r.separated ? `, ${r.separated} same-name participant${r.separated === 1 ? "" : "s"} kept separate` : ""}${r.merged ? `, ${r.merged} merged as the same person` : ""}${r.banks ? `, ${r.banks} word bank${r.banks === 1 ? "" : "s"}` : ""}${r.tasks ? `, ${r.tasks} custom task${r.tasks === 1 ? "" : "s"}` : ""}.`

// Erases everything this page keeps in the browser: participants, results, uploaded word banks and settings.

  let remoteOk = true;

  let cleared = true;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { cleared = false; }

    ? "The page's data was cleared, but the browser would not let its storage be erased."

      ? "Data on this device was wiped. Shared storage could not be reached, so it was not erased."
      : alsoShared ? "All stored data was wiped on this device and in shared storage. Settings are back to their defaults."
      : "All stored data was wiped. Settings are back to their defaults.";

// ------------------------------------------------------- developer accounts
// Each developer has their own name and password, and what they do is written to an audit log.
// Like the participant accounts this runs in the page, so it keeps honest people honest; it is not
// protection against someone who can open the browser's storage.
// normDevData runs while the data loads, so it uses only plain values and hoisted functions.
function normDevData(d) {
  const src = d.devs && typeof d.devs === "object" ? d.devs : {};
  d.devs = {};
  for (const [k, v] of Object.entries(src)) {
    const a = v && v.auth;
    if (!a || !a.hash || !a.salt || !(a.iter > 0)) continue;
    d.devs[k] = {
      name: String(v.name || k), role: v.role === "analyst" ? "analyst" : "owner", disabled: v.disabled === true,
      created: v.created || "", updated: v.updated || v.created || "", auth: { alg: a.alg || "pbkdf2-sha256", iter: a.iter, salt: a.salt, hash: a.hash },
    };
  }
  // Removed accounts are remembered (name key -> when), so shared storage can't bring them back.
  const gone = d.devGone && typeof d.devGone === "object" ? d.devGone : {};
  d.devGone = {};
  for (const [k, v] of Object.entries(gone)) if (typeof v === "string" && !d.devs[k]) d.devGone[k] = v;
  d.devConfigAt = typeof d.devConfigAt === "string" ? d.devConfigAt : "";     // when recovery/conditions last changed (newest wins across devices)
  d.devSyncedAt = typeof d.devSyncedAt === "string" ? d.devSyncedAt : "";     // when developer data was last read from shared storage
  d.devSettings = { recovery: !(d.devSettings && d.devSettings.recovery === false) };
  d.audit = (Array.isArray(d.audit) ? d.audit : []).filter((x) => x && x.t && x.action).slice(-1000);
  d.audit.forEach((x, i) => { if (!x.id) x.id = "l" + hash64(`${x.t}|${x.dev}|${x.action}|${i}`); });
  d.conditions = normConditions(d.conditions);
  d.timing = (Array.isArray(d.timing) ? d.timing : []).filter((x) => x && x.id && x.t).slice(-50);
}

const DEV = { minPass: 8, auditMax: 1000, roleLabel: { owner: "Owner", analyst: "Analyst" } };

const activeOwners = () => Object.values(data.devs).filter((d) => d.role === "owner" && !d.disabled);

function audit(action, detail) {

// ------------------------------------------ developer accounts in shared storage
// Developer accounts, the study conditions and the audit log are copied to shared storage, so they
// follow a developer to another browser or device. Like everything else they are saved on this
// device first and sent when a connection is available. The newest change to an account wins.
// Shared storage holds: "devs" (one document per developer, or a "removed" marker), "audit" (one
// per entry) and "devmeta/config" (recovery setting and study conditions).

const DEV_DOC_TIMEOUT = 8000;

function devTouch(key) {
  const d = data.devs[key];
  if (d) d.updated = new Date().toISOString();
  if (!data.pending.devs.includes(key)) data.pending.devs.push(key);
  S.saveOk = saveData();

}
function configTouch() {

  data.pending.config = true;
  S.saveOk = saveData();

function queueAllDevData() {
  for (const k of Object.keys(data.devs)) if (!data.pending.devs.includes(k)) data.pending.devs.push(k);
  if (data.conditions.groups.length) { data.devConfigAt = new Date().toISOString(); data.pending.config = true; }
}

const devDoc = (key) => {
  const d = data.devs[key];
  if (d) return JSON.parse(JSON.stringify({ key, name: d.name, role: d.role, disabled: d.disabled, created: d.created, updated: d.updated, auth: d.auth, removed: false }));
  const at = data.devGone[key];
  return at ? { key, removed: true, updated: at } : null;
};

// Sends waiting developer data. Returns false when sending failed (try again later).
async function flushDevPending(db) {
  const p = data.pending;
  try {
    for (const key of [...p.devs]) {
      const doc = devDoc(key);
      if (doc) await withTimeout(db.collection("devs").doc(devDocId(key)).set(doc), CFG.syncTimeoutMs);
      p.devs = p.devs.filter((x) => x !== key);
      syncOk();
    }
    if (p.config) {
      await withTimeout(db.collection("devmeta").doc("config").set(JSON.parse(JSON.stringify({
        recovery: data.devSettings.recovery, conditions: data.conditions, updated: data.devConfigAt,
      }))), CFG.syncTimeoutMs);
      p.config = false;
      syncOk();
    }
    const byId = new Map(data.audit.map((x) => [x.id, x]));
    for (const id of [...p.audit]) {
      const e = byId.get(id);
      if (e) await withTimeout(db.collection("audit").doc(id).set(JSON.parse(JSON.stringify(e))), CFG.syncTimeoutMs);
      p.audit = p.audit.filter((x) => x !== id);
      syncOk();
    }

  } catch (e) { noteSyncErr(e); return false; }

function mergeDevDoc(d) {
  if (!d || !d.key) return false;
  const key = String(d.key), mine = data.devs[key], gone = data.devGone[key] || "", at = typeof d.updated === "string" ? d.updated : "";
  if (d.removed === true) {
    if (mine && at > (mine.updated || "")) { delete data.devs[key]; data.devGone[key] = at; return true; }
    if (!mine && at > gone) data.devGone[key] = at;
    return false;
  }
  const a = d.auth;
  if (!a || !a.hash || !a.salt || !(a.iter > 0) || !d.name) return false;
  if (gone && gone >= at) return false;                      // it was removed after this version
  if (mine && (mine.updated || "") >= at) return false;      // this device already has the same or a newer version
  data.devs[key] = {
    name: String(d.name).slice(0, 30), role: d.role === "analyst" ? "analyst" : "owner", disabled: d.disabled === true,
    created: d.created || "", updated: at, auth: { alg: a.alg || "pbkdf2-sha256", iter: a.iter, salt: a.salt, hash: a.hash },
  };

}
function mergeAuditDoc(e) {
  if (!e || !e.id || !e.t || !e.action) return false;
  if (data.audit.some((x) => x.id === e.id)) return false;
  data.audit.push({ id: String(e.id), t: String(e.t), dev: String(e.dev || ""), action: String(e.action), detail: String(e.detail || "") });
  return true;
}
function mergeConfigDoc(c) {
  if (!c || typeof c.updated !== "string" || c.updated <= data.devConfigAt) return false;
  data.devSettings.recovery = c.recovery !== false;
  data.conditions = normConditions(c.conditions);
  data.devConfigAt = c.updated;
  return true;
}

// Reads developer data from shared storage into this device. Returns how many things changed.
async function pullDevData(db) {
  let n = 0;
  const devs = await withTimeout(db.collection("devs").limit(500).get(), 20000);
  devs.docs.forEach((d) => { if (mergeDevDoc(d.data())) n++; });
  const au = await withTimeout(db.collection("audit").limit(1000).get(), 20000);
  let added = 0;
  au.docs.forEach((d) => { if (mergeAuditDoc(d.data())) added++; });
  if (added) {
    data.audit.sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
    if (data.audit.length > DEV.auditMax) data.audit.splice(0, data.audit.length - DEV.auditMax);
    n += added;
  }
  try {
    const cfg = await withTimeout(db.collection("devmeta").doc("config").get(), CFG.syncTimeoutMs);
    if (cfg && cfg.exists !== false && typeof cfg.data === "function" && mergeConfigDoc(cfg.data())) n++;
  } catch (e) { /* an unreadable config document is not fatal */ }
  data.devSyncedAt = new Date().toISOString();
  // A developer who was turned off or removed on another device loses this device's session too.
  if (S.dev && (!data.devs[S.dev.key] || data.devs[S.dev.key].disabled)) { S.dev = null; S.devOk = false; S.devKicked = true; }
  return n;

// Quick read used by the sign-in screens. Returns the number of changes, or -1 when shared storage could not be reached.
async function pullDevs() {
  try {
    const db = await withTimeout(syncDb(), DEV_DOC_TIMEOUT);
    if (!db) return -1;
    const n = await withTimeout(pullDevData(db), DEV_DOC_TIMEOUT * 3);
    saveData();
    syncOk();
    return n;
  } catch (e) { noteSyncErr(e); return -1; }
}

  slow:      "Level 1 reaction time over 1000 ms",
  early:     "Pressed before the word 3 or more times in Level 1",
  few:       "Fewer than 10 words were answered",
  lowacc:    "Accuracy under 60%",
  misses:    "Missed at least half of the words that needed a press",
  pressall:  "Pressed on at least half of the words that should be ignored",
  anticip:   "At least 20% of responses came in under 100 ms",

// ---------------------------------------------------------------- bulk actions
// Select several participants on the Developer page and act on all of them: tag, exclude or keep their
// attempts, set a study group, merge them into one participant, or delete them. Every action is written
// to the audit log once, with the names it touched. Merge and delete are owner-only.
const bulkSel = () => S.bulk || (S.bulk = new Set());
const nameList = (us) => { const t = us.map((u) => u.name).join(", "); return t.length > 160 ? t.slice(0, 157) + "…" : t; };

function bulkTag(keys, tag) {
  const now = new Date().toISOString();
  const us = keys.map((k) => data.users[k]).filter(Boolean);
  for (const u of us) { u.tag = tag; u.updated = now; queueUser(userKey(u)); }
  S.saveOk = saveData(); kick();
  audit("bulk tag", `${tag ? `tag "${tag}"` : "tag cleared"} on ${us.length}: ${nameList(us)}`);
  return us.length;
}
// Applies a review decision to every attempt of the chosen participants that passes the current filters.
function bulkReview(keys, decision, reason) {
  const at = new Date().toISOString(), by = S.dev ? S.dev.name : "";

  const us = keys.map((k) => data.users[k]).filter(Boolean);
  for (const u of us) {
    for (const a of filtered(u)) {
      const was = decided(a) ? a.review.excluded : null;
      if ((decision === "exclude" && was === true) || (decision === "keep" && was === false)) continue;
      a.review = { excluded: decision === "exclude", reason: String(reason || "").slice(0, 120), by, at };
      queueAttempt(a.id); n++;

  }
  S.saveOk = saveData(); kick();
  audit(decision === "exclude" ? "bulk exclude" : "bulk keep", `${n} attempts of ${us.length}: ${nameList(us)}${reason ? ` — ${reason}` : ""}`);
  return n;
}

// Removes a participant and everything of theirs from this device (and from shared storage when it is on).
async function removeParticipant(key) {

  data.pending.users = data.pending.users.filter((x) => x !== key);
  data.pending.claims = data.pending.claims.filter((x) => x !== key);
  const ids = new Set(u.attempts.map((a) => a.id));
  data.pending.attempts = data.pending.attempts.filter((x) => !ids.has(x));

// Merges the chosen participants into one. The target keeps its own username, password and details; the
// others' attempts move over (an attempt already there is not copied twice), and they are then removed.
async function bulkMerge(keys, targetKey) {
  const t = data.users[targetKey];
  if (!t) return { error: "Choose who to keep." };
  const from = keys.filter((k) => k !== targetKey && data.users[k]);
  if (!from.length) return { error: "Select at least two participants." };
  const have = new Set(t.attempts.map((a) => a.id));
  let moved = 0, dupes = 0;
  const movedIds = [], notes = [];
  for (const k of from) {
    const s = data.users[k];
    for (const a of s.attempts) {
      if (have.has(a.id)) { dupes++; continue; }
      have.add(a.id); t.attempts.push(a); movedIds.push(a.id); moved++;
    }
    if (!t.tag && s.tag) t.tag = s.tag;
    if (s.note) notes.push(`[from ${s.name}] ${s.note}`);
    for (const f of ["age", "hand", "device"]) if (!t.profile[f] && s.profile && s.profile[f]) t.profile[f] = s.profile[f];
    if (!t.group && s.group) t.group = s.group;
  }
  if (notes.length) t.note = [t.note, ...notes].filter(Boolean).join("\n");
  t.updated = new Date().toISOString();
  rebuildResults(t);
  queueUser(targetKey);
  const names = nameList(from.map((k) => data.users[k]));
  for (const k of from) await removeParticipant(k);
  // removeParticipant dropped the moved attempts from the send queue; queue them again under the target
  for (const id of movedIds) queueAttempt(id);
  saveData(); kick();
  audit("participants merged", `${names} into ${t.name}: ${moved} attempts moved, ${dupes} already there`);
  return { ok: true, moved, dupes, merged: from.length, into: t.name };

// Gives a participant a new username on this device. With shared storage on, the new name is reserved there first.
async function devRenameUser(key, newName) {
  const u = data.users[key];
  if (!u) return { error: "That participant no longer exists." };
  const n = normName(newName), nk = nameKey(n), prob = nameProblem(n);
  if (prob === "nameLen") return { error: "A username needs 3 to 30 characters." };
  if (prob) return { error: "Use letters, numbers, spaces, dots, underscores and hyphens only (it must start and end with a letter or number)." };
  if (nk === key && n === u.name) return { error: "That is already their username." };
  if (nk !== key && data.users[nk]) return { error: "That username is already used by another participant here." };
  if (settings().sync && u.auth) {
    const r = await claimName(nk, n, u.auth);
    if (r === "taken") return { error: "That username is taken in shared storage." };
    if (r === "busy") return { error: "Shared storage is busy. Try again in a moment." };
  }
  const oldName = u.name;
  delete data.users[key];
  u.name = n; u.updated = new Date().toISOString();
  data.users[nk] = u;
  if (u.auth && settings().sync) { u.auth.state = "pending"; queueClaim(nk); }
  data.pending.users = data.pending.users.filter((x) => x !== key);
  data.pending.claims = data.pending.claims.filter((x) => x !== key);
  for (const a of u.attempts) queueAttempt(a.id);
  queueUser(nk);
  if (data.last_user && nameKey(data.last_user) === key) data.last_user = n;
  if (S.bulk) { S.bulk.delete(key); }
  saveData();
  if (settings().sync) deleteRemoteUser(key).catch(() => {});
  kick();
  audit("participant renamed", `${oldName} → ${n}`);
  return { ok: true, key: nk };
}

// A tick box for one table row, and a "select all shown" box for the header.
function bulkCheck(u, onChange) {

// ------------------------------------------------------- word-bank editor
// Developer page > Word banks. Owners create, edit, duplicate and delete banks without leaving the page;
// analysts can look at them and download them. Each save raises the bank's revision number, which is
// recorded on every attempt, so results from before and after a change can be told apart.
const BANK_LIMITS = { name: 40, word: 24, perColumn: 500 };
const bankRev = (b) => (b && b.rev > 0 ? b.rev : 1);
const bankUses = (b) => allAttempts().filter((a) => (a.settings || {}).word_bank === b.name).length;
const bankGroups = (b) => data.conditions.groups.filter((g) => g.bankId === b.id).map((g) => g.name);
const sameWord = (a, b) => a.toLowerCase() === b.toLowerCase();

// Turns the text boxes into a bank, or lists what is wrong. `texts` maps each column key to its text.
function checkBankDraft(id, name, texts) {
  const errors = [], words = {};
  const nm = normName(name).slice(0, BANK_LIMITS.name);
  if (!nm) errors.push("Give the word bank a name.");
  else if (allBanks().some((b) => b.id !== id && b.name.toLowerCase() === nm.toLowerCase())) errors.push(`A word bank called "${nm}" already exists.`);
  for (const [k, label] of COLS) {
    const raw = String(texts[k] || "").split(/\r?\n/).map((x) => x.normalize("NFKC").replace(/[\u0000-\u001f\u007f]/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
    const list = uniq(raw);
    words[k] = list;
    const long = list.filter((w) => w.length > BANK_LIMITS.word);
    if (list.length < CFG.minBankWords) errors.push(`${label}: at least ${CFG.minBankWords} different words are needed (there are ${list.length}).`);
    if (list.length > BANK_LIMITS.perColumn) errors.push(`${label}: at most ${BANK_LIMITS.perColumn} words (there are ${list.length}).`);
    if (long.length) errors.push(`${label}: words longer than ${BANK_LIMITS.word} characters do not fit on screen: ${long.slice(0, 3).join(", ")}${long.length > 3 ? "…" : ""}.`);
  }
  // A word that sits in both columns of a decision pair would have two right answers.
  for (const [a, b, what] of [["animal", "notAnimal", "Level 2 (animal or not)"], ["fruit", "occupation", "Level 3 (food or occupation)"]]) {
    const clash = words[a].filter((w) => words[b].some((x) => sameWord(w, x)));
    if (clash.length) errors.push(`${what}: ${clash.slice(0, 4).join(", ")}${clash.length > 4 ? "…" : ""} appears in both ${COLS.find((c) => c[0] === a)[1]} and ${COLS.find((c) => c[0] === b)[1]}.`);
  }
  return { ok: !errors.length, errors, name: nm, words };
}
// A free bank name: the stem (shortened if needed), then the suffix, then a number if that is taken.
const uniqueBankName = (stem, suffix = "") => {
  const base = normName(stem).replace(/\s*\(built in\)$/i, "").slice(0, BANK_LIMITS.name - suffix.length - 3).trim();
  let i = 1, cand = base + suffix;
  while (allBanks().some((b) => b.name.toLowerCase() === cand.toLowerCase())) cand = `${base}${suffix} ${++i}`;
  return cand;
};

function bankSave(id, name, texts) {
  const r = checkBankDraft(id, name, texts);
  if (!r.ok) return r;
  const counts = COLS.map(([k, l]) => `${l} ${r.words[k].length}`).join(", ");
  if (id) {
    const b = data.banks.find((x) => x.id === id);
    if (!b) return { ok: false, errors: ["That word bank no longer exists."] };
    const old = b.name, uses = bankUses(b);
    b.name = r.name; b.words = r.words; b.rev = bankRev(b) + 1;
    S.saveOk = saveData();
    audit("word bank edited", `${old}${old !== r.name ? ` → ${r.name}` : ""}, revision ${b.rev}: ${counts}`);
    return { ok: true, id, rev: b.rev, uses, renamed: old !== r.name };
  }
  const b = { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: r.name, added: new Date().toISOString(), rev: 1, words: r.words };
  data.banks.push(b);
  S.saveOk = saveData();
  audit("word bank created", `${r.name}: ${counts}`);
  return { ok: true, id: b.id, rev: 1, uses: 0 };
}
function bankDuplicate(id) {
  const src = allBanks().find((b) => b.id === id);
  if (!src) return null;
  const b = { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: uniqueBankName(src.name, " copy"), added: new Date().toISOString(), rev: 1, words: JSON.parse(JSON.stringify(src.words)) };
  data.banks.push(b);
  S.saveOk = saveData();
  audit("word bank duplicated", `${src.name} → ${b.name}`);
  return b;
}
function bankDelete(id) {
  const b = data.banks.find((x) => x.id === id);
  if (!b) return false;
  data.banks = data.banks.filter((x) => x.id !== id);
  if (settings().bankId === id) settings().bankId = "builtin";
  for (const g of data.conditions.groups) if (g.bankId === id) { g.bankId = "builtin"; configTouch(); }
  S.saveOk = saveData();
  audit("word bank deleted", `${b.name} (revision ${bankRev(b)})`);
  return true;
}
async function bankDownload(b, say) {
  const cols = COLS.map(([k]) => b.words[k]), rows = [];
  for (let i = 0; i < Math.max(...cols.map((c) => c.length)); i++) rows.push(cols.map((c) => c[i] || ""));
  const slug = String(b.name).normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "word-bank";
  try {
    await saveFile(`${slug}_rev${bankRev(b)}.xlsx`, makeXlsx([{ name: "Word bank", head: COLS.map((c) => c[1]), rows }]), XLSX_MIME);
    audit("word bank downloaded", b.name);
    say(`Saved ${slug}_rev${bankRev(b)}.xlsx. It can be uploaded again on the Settings page.`);
  } catch (e) { say(e && e.code === "declined" ? "Download cancelled." : "The file could not be saved."); }
}

// ------------------------------------------------------------- custom tasks
// A custom task is one of the three task types (simple reaction time, go/no-go, choice) with its own name,
// instructions, length, word bank and timing. Developers (owners) build them on Developer page > Custom tasks;
// enabled ones appear on each participant's home screen. Runs are recorded like any other attempt, tagged
// with the task's name and revision, and kept apart from the standard levels in results and exports.

// Runs while data loads (module 03), so it uses only plain values and no constants from this file.
function normCustomTasks(list) {
  const out = [], seen = {};
  const num = (v, lo, hi, d) => { v = Math.round(Number(v)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  for (const c of Array.isArray(list) ? list : []) {
    if (!c || typeof c !== "object" || !c.id || !c.name || seen[c.id]) continue;
    seen[c.id] = 1;
    const kind = c.kind === "gonogo" || c.kind === "choice" ? c.kind : "simple";
    const lo = num(c.foreMin, 500, 30000, 1000), hi = num(c.foreMax, 500, 30000, 10000);
    out.push({
      id: String(c.id).slice(0, 30), name: String(c.name).slice(0, 40), kind,
      seconds: num(c.seconds, 10, 600, 60), trials: num(c.trials, 1, 30, 3),
      foreMin: Math.min(lo, hi), foreMax: Math.max(lo, hi), goShare: num(c.goShare, 10, 90, 70),
      repeat: c.repeat !== false, bankId: typeof c.bankId === "string" ? c.bankId : "",
      practice: c.practice === "on" || c.practice === "off" ? c.practice : "default",
      note: typeof c.note === "string" ? c.note.slice(0, 400) : "", enabled: c.enabled !== false,
      rev: num(c.rev, 1, 9999, 1), created: typeof c.created === "string" ? c.created : "",
    });
  }
  return out;
}
const CUSTOM_KINDS = [
  { value: "simple", label: "Simple reaction time", n: 1 },
  { value: "gonogo", label: "Go / No-Go", n: 2 },
  { value: "choice", label: "Choice reaction time", n: 3 },
];
const kindOf = (c) => CUSTOM_KINDS.find((k) => k.value === c.kind) || CUSTOM_KINDS[0];
const customUses = (c) => allAttempts().filter((a) => a.custom && a.custom.id === c.id).length;
// Custom tasks that exist or that attempts refer to (a deleted task's attempts stay filterable).
function customSeen() {
  const map = new Map(data.customTasks.map((c) => [c.id, c.name]));
  for (const a of allAttempts()) if (a.custom && !map.has(a.custom.id)) map.set(a.custom.id, a.custom.name);
  return [...map].map(([id, name]) => ({ id, name })).sort((x, y) => x.name.localeCompare(y.name));
}
const customSummary = (c) => {
  const bank = c.bankId ? (allBanks().find((b) => b.id === c.bankId) || { name: "(missing, uses the default)" }).name : "the device's word bank";
  const fore = `${c.foreMin / 1000}–${c.foreMax / 1000} s wait`;
  if (c.kind === "simple") return `${c.trials} trial${c.trials === 1 ? "" : "s"}, ${fore}, words from ${bank}`;
  return `${c.seconds} s, ${c.kind === "gonogo" ? `${c.goShare}% go words, ` : ""}repetition ${c.repeat ? "allowed" : "not allowed"}, words from ${bank}`;
};

// ------------------------------------------------------ participant side
function customStatus(c) {
  const last = (S.user ? S.user.attempts : []).filter((a) => a.custom && a.custom.id === c.id).sort((x, y) => (x.timestamp < y.timestamp ? 1 : -1))[0];
  if (!last) return t("Not played yet");
  const s = last.summary || {};
  return last.task === 1 ? `${t("Last")}: ${Math.round(s.rt_ms)} ms` : `${t("Last")}: ${s.mean_rt_ms != null ? Math.round(s.mean_rt_ms) + " ms" : "n/a"}, ${Math.round(s.accuracy_pct)}%`;
}
function customRows() {
  const on = data.customTasks.filter((c) => c.enabled);
  if (!on.length) return null;
  return h("div", { class: "section", id: "customtasks" },
    h("h2", {}, t("Extra tasks")),
    h("div", { class: "levels" }, on.map((c) => {
      const done = !!(S.user && S.user.attempts.some((a) => a.custom && a.custom.id === c.id));

        h("span", { class: "badge b" + kindOf(c).n, "aria-hidden": "true" }, "+"),

    })));
}

// ------------------------------------------------------------- checking
// `f` holds what the form says (strings). Returns the clean task, or the list of problems.
function checkCustomDraft(id, f) {
  const errors = [];
  const name = normName(f.name).slice(0, 40);
  if (!name) errors.push("Give the task a name.");
  else if (data.customTasks.some((c) => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) errors.push(`A custom task called "${name}" already exists.`);
  const kind = CUSTOM_KINDS.some((k) => k.value === f.kind) ? f.kind : "simple";
  const int = (v, lo, hi, what, unit = "") => {
    const x = Number(String(v).trim());
    if (String(v).trim() === "" || !isFinite(x) || Math.round(x) !== x || x < lo || x > hi) { errors.push(`${what}: a whole number from ${lo} to ${hi}${unit}.`); return null; }
    return x;
  };
  const t = { id: id || "", name, kind, repeat: f.repeat !== false, practice: ["on", "off"].includes(f.practice) ? f.practice : "default", enabled: f.enabled !== false };
  if (kind === "simple") {
    t.trials = int(f.trials, 1, 30, "Trials");
    const a = Number(String(f.foreMin).trim()), b = Number(String(f.foreMax).trim());
    if (!isFinite(a) || !isFinite(b) || a < 0.5 || b > 30 || a > b) errors.push("Wait before the word: the shortest must be at least 0.5 s, the longest at most 30 s, and the shortest cannot be longer than the longest.");
    else { t.foreMin = Math.round(a * 1000); t.foreMax = Math.round(b * 1000); }
  } else {
    t.seconds = int(f.seconds, 10, 600, "Time limit", " seconds");
    if (kind === "gonogo") t.goShare = int(f.goShare, 10, 90, "Share of go words", " percent");
  }
  const note = String(f.note || "").replace(/\r/g, "").trim();
  if (note.length > 400) errors.push("The instructions note can be at most 400 characters.");
  t.note = note.slice(0, 400);
  t.bankId = f.bankId && allBanks().some((b) => b.id === f.bankId) ? f.bankId : "";
  return { ok: !errors.length, errors, task: t };
}

// -------------------------------------------------------------- changes
function customSave(id, f) {
  const r = checkCustomDraft(id, f);
  if (!r.ok) return r;
  const merged = normCustomTasks([Object.assign({}, r.task, { id: id || "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) })])[0];
  if (id) {
    const old = data.customTasks.find((c) => c.id === id);
    if (!old) return { ok: false, errors: ["That task no longer exists."] };
    merged.rev = old.rev + 1; merged.created = old.created;
    data.customTasks[data.customTasks.indexOf(old)] = merged;
    audit("custom task edited", `${old.name}${old.name !== merged.name ? ` → ${merged.name}` : ""}, revision ${merged.rev}: ${customSummary(merged)}`);
  } else {
    merged.rev = 1; merged.created = new Date().toISOString();
    data.customTasks.push(merged);
    audit("custom task created", `${merged.name} (${kindOf(merged).label}): ${customSummary(merged)}`);
  }
  S.saveOk = saveData();
  return { ok: true, task: merged };
}
function customDuplicate(id) {
  const src = data.customTasks.find((c) => c.id === id);
  if (!src) return null;
  let name = `${src.name.slice(0, 35)} copy`, i = 1;
  while (data.customTasks.some((c) => c.name.toLowerCase() === name.toLowerCase())) name = `${src.name.slice(0, 33)} copy ${++i}`;
  const c = Object.assign({}, src, { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, rev: 1, enabled: false, created: new Date().toISOString() });
  data.customTasks.push(c);
  S.saveOk = saveData();
  audit("custom task duplicated", `${src.name} → ${name}`);
  return c;
}
function customSetEnabled(id, on) {
  const c = data.customTasks.find((x) => x.id === id);
  if (!c) return false;
  c.enabled = on; S.saveOk = saveData();
  audit(on ? "custom task enabled" : "custom task disabled", c.name);
  return true;
}
function customDelete(id) {
  const c = data.customTasks.find((x) => x.id === id);
  if (!c) return false;
  data.customTasks = data.customTasks.filter((x) => x.id !== id);
  S.saveOk = saveData();
  audit("custom task deleted", `${c.name} (revision ${c.rev}), ${customUses(c)} attempts keep its name`);
  return true;
}
// From a backup: new tasks are added; the same id with different settings (edited elsewhere) is kept as a copy.
function importCustomTasks(list, from) {
  let added = 0;
  for (const c of normCustomTasks(list)) {
    const have = data.customTasks.find((x) => x.id === c.id);
    if (!have) { data.customTasks.push(c); added++; continue; }
    const strip = (x) => JSON.stringify([x.name, x.kind, x.seconds, x.trials, x.foreMin, x.foreMax, x.goShare, x.repeat, x.bankId, x.practice, x.note]);
    if (strip(have) === strip(c)) continue;
    let name = `${c.name.slice(0, 40 - (from || "other device").length - 3)} (${from || "other device"})`, i = 1;
    while (data.customTasks.some((x) => x.name.toLowerCase() === name.toLowerCase())) name = `${name.slice(0, 36)} ${++i}`;
    data.customTasks.push(Object.assign({}, c, { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, enabled: false })); added++;
  }
  return added;
}
