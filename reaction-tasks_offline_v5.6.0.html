function showCustomTasks(msg) {
  if (!S.devOk || !S.dev) { showDevGate(); return; }
  reset("dev");
  S.devView = "custom";
  const owner = isOwner();
  const rows = data.customTasks.map((c) => {
    const uses = customUses(c);
    return h("div", { class: "card-in group", "data-custom": c.id },
      h("h2", {}, c.name),
      h("p", { class: "small" }, `${kindOf(c).label} · ${customSummary(c)}`),
      h("p", { class: "muted small" }, `Revision ${c.rev} · ${c.enabled ? "shown to participants" : "hidden from participants"} · run ${uses} time${uses === 1 ? "" : "s"}`),
      c.note && h("p", { class: "muted small" }, `Instructions note: ${c.note}`),
      h("div", { class: "row" },
        owner && btn("Edit", () => showCustomEditor(c.id), "primary small"),
        owner && btn(c.enabled ? "Hide from participants" : "Show to participants", () => { customSetEnabled(c.id, !c.enabled); showCustomTasks(`"${c.name}" is now ${c.enabled ? "shown to" : "hidden from"} participants.`); }, "small"),
        owner && btn("Duplicate", () => { const d = customDuplicate(c.id); showCustomTasks(`Made "${d.name}" (hidden until you show it).`); }, "small"),
        owner && confirmBtn("Delete", () => { customDelete(c.id); showCustomTasks(`Deleted "${c.name}". ${uses ? "Attempts already run keep its name." : ""}`.trim()); }, "danger small")));
  });
  wideScreen(
    h("h1", {}, "Custom tasks"),
    h("p", { class: "muted" }, "Build your own version of a task: pick the type, set its length, words and instructions, and show it to participants as an extra task on their home screen. Custom runs are recorded with the task's name and revision and are kept out of the standard Level 1 to 3 results; use the Tasks filter on the Developer page to look at them."),
    owner ? null : h("p", { class: "muted small" }, "Only an owner can change custom tasks."),
    msg && h("p", { class: "muted small", role: "status", id: "customnote" }, msg),
    rows.length ? rows : h("p", { class: "muted" }, "No custom tasks yet."),
    owner && btn("New custom task", () => showCustomEditor(null), "small"),
    h("div", { class: "row" }, btn("Back to Developer view", showDev, "primary")));
}

function showCustomEditor(id, draft, errors) {
  if (!S.devOk || !S.dev) { showDevGate(); return; }
  if (!isOwner()) { showCustomTasks(); return; }
  reset("dev");
  S.devView = "customedit";
  const c = id ? data.customTasks.find((x) => x.id === id) : null;
  if (id && !c) { showCustomTasks("That task no longer exists."); return; }
  const base = c || { name: "", kind: "simple", seconds: 60, trials: 3, foreMin: 1000, foreMax: 10000, goShare: 70, repeat: true, bankId: "", practice: "default", note: "", enabled: false };
  const d = draft || { name: base.name, kind: base.kind, seconds: String(base.seconds), trials: String(base.trials), foreMin: String(base.foreMin / 1000), foreMax: String(base.foreMax / 1000),
    goShare: String(base.goShare), repeat: base.repeat, bankId: base.bankId, practice: base.practice, note: base.note, enabled: base.enabled };
  const inputs = {};
  const field = (key, label, hint, extra = {}) => {
    const el = h("input", Object.assign({ type: "number", id: "ct-" + key, inputmode: "decimal", value: d[key], "aria-label": label }, extra));
    inputs[key] = el;
    return h("label", { class: "field" }, label, el, hint && h("span", { class: "muted small" }, hint));
  };
  const nameIn = h("input", { type: "text", id: "ct-name", maxlength: "40", value: d.name, "aria-label": "Task name" });
  const noteIn = h("textarea", { id: "ct-note", rows: "4", class: "notearea", maxlength: "400", "aria-label": "Instructions note" }); noteIn.value = d.note;
  const read = () => ({ name: nameIn.value, kind: d.kind, seconds: (inputs.seconds || {}).value ?? d.seconds, trials: (inputs.trials || {}).value ?? d.trials,
    foreMin: (inputs.foreMin || {}).value ?? d.foreMin, foreMax: (inputs.foreMax || {}).value ?? d.foreMax, goShare: (inputs.goShare || {}).value ?? d.goShare,
    repeat: d.repeat, bankId: d.bankId, practice: d.practice, note: noteIn.value, enabled: d.enabled });
  const redo = () => showCustomEditor(id, read(), []);
  const banks = [{ value: "", label: "The device's word bank (Settings)" }, ...allBanks().map((b) => ({ value: b.id, label: b.name }))];
  const err = h("div", { class: "err", role: "alert", id: "customerrors" }, (errors || []).map((e) => h("p", {}, e)));
  wideScreen(
    h("h1", {}, c ? "Edit custom task" : "New custom task"),
    c && customUses(c) > 0 && h("p", { class: "notice small", id: "customwarn" }, `Run ${customUses(c)} time${customUses(c) === 1 ? "" : "s"} as revision ${c.rev}. Saving makes revision ${c.rev + 1}; earlier attempts keep their revision number.`),
    h("label", { class: "field" }, "Name (shown to participants)", nameIn),
    seg(CUSTOM_KINDS.map((k) => ({ value: k.value, label: k.label })), d.kind, (v) => { d.kind = v; d.draftKind = v; const x = read(); x.kind = v; showCustomEditor(id, x, []); }, "Type of task"),
    d.kind === "simple"
      ? [field("trials", "Trials (reaction times averaged)", "1 to 30", { min: "1", max: "30", step: "1" }),
         field("foreMin", "Shortest wait before a word (seconds)", "0.5 to 30", { min: "0.5", max: "30", step: "0.5" }),
         field("foreMax", "Longest wait before a word (seconds)", "0.5 to 30", { min: "0.5", max: "30", step: "0.5" })]
      : [field("seconds", "Time limit (seconds)", "10 to 600", { min: "10", max: "600", step: "1" }),
         d.kind === "gonogo" && field("goShare", "Share of go words (percent animals)", "10 to 90", { min: "10", max: "90", step: "1" }),
         d.kind !== "simple" && seg([{ value: true, label: "Repetition allowed" }, { value: false, label: "No repetition" }], d.repeat, (v) => { d.repeat = v; redo(); }, "Repetition")],
    selectField("Word bank", "ct-bank", banks, d.bankId, (v) => { d.bankId = v; }),
    seg([{ value: "default", label: "Follow Settings" }, { value: "on", label: "Practice on" }, { value: "off", label: "Practice off" }], d.practice, (v) => { d.practice = v; redo(); }, "Practice before the task"),
    h("label", { class: "field" }, "Instructions note (optional, shown above the standard instructions)", noteIn),
    seg([{ value: true, label: "Shown to participants" }, { value: false, label: "Hidden" }], d.enabled, (v) => { d.enabled = v; redo(); }, "Visibility"),
    err,
    h("div", { class: "row" },
      btn("Save custom task", () => {
        const f = read(), r = customSave(id, f);
        if (!r.ok) { showCustomEditor(id, f, r.errors); return; }
        showCustomTasks(`Saved "${r.task.name}"${id ? ` as revision ${r.task.rev}` : ""}.`);
      }, "primary"),
      btn("Cancel", () => showCustomTasks("Nothing was changed."))));
  const first = document.getElementById(errors && errors.length ? "customerrors" : "ct-name"); if (first && first.focus) first.focus();
}
